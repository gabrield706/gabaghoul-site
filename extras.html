    <button id="animation-toggle" type="button" hidden>Pause background</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('character-background');
            const context = canvas.getContext('2d');
            if (!context) return;

            const button = document.getElementById('animation-toggle');
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            // Adjust these settings to change the atmosphere.
            const characters = 'abcdefghijklmnopqrstuvwxyz0123456789<>/\\[]{}!?@#$%&*+=:;._';
            const color = '255, 255, 255';
            const fontSize = 16;
            const cellWidth = 20;
            const cellHeight = 26;
            const updateInterval = 100; // Milliseconds; higher numbers change more slowly.
            const changeChance = 0.085; // Fraction of cells that change per update.

            let cells = [];
            let width = 0;
            let height = 0;
            let timer = null;
            let paused = reducedMotion.matches;

            function randomCell() {
                return {
                    character: Math.random() < 0.25 ? ' ' :
                        characters[Math.floor(Math.random() * characters.length)],
                    opacity: 0.58 + Math.random() * 0.12
                };
            }

            function draw() {
                context.clearRect(0, 0, width, height);
                context.font = fontSize + 'px "Courier New", monospace';
                context.textBaseline = 'top';
                const columns = Math.ceil(width / cellWidth);
                cells.forEach((cell, index) => {
                    const x = (index % columns) * cellWidth;
                    const y = Math.floor(index / columns) * cellHeight;
                    context.fillStyle = 'rgba(' + color + ',' + cell.opacity + ')';
                    context.fillText(cell.character, x, y);
                });
            }

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                const scale = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.round(width * scale);
                canvas.height = Math.round(height * scale);
                context.setTransform(scale, 0, 0, scale, 0, 0);
                const count = Math.ceil(width / cellWidth) * Math.ceil(height / cellHeight);
                cells = Array.from({ length: count }, randomCell);
                draw();
            }

            function update() {
                for (let index = 0; index < cells.length; index++) {
                    if (Math.random() < changeChance) cells[index] = randomCell();
                }
                draw();
            }

            function syncAnimation() {
                window.clearInterval(timer);
                timer = null;
                if (!paused && !document.hidden) {
                    timer = window.setInterval(update, updateInterval);
                }
                button.textContent = paused ? 'Resume background' : 'Pause background';
            }

            button.hidden = false;
            button.addEventListener('click', () => {
                paused = !paused;
                syncAnimation();
            });
            reducedMotion.addEventListener('change', () => {
                paused = reducedMotion.matches;
                syncAnimation();
            });
            document.addEventListener('visibilitychange', syncAnimation);
            window.addEventListener('resize', resize);
            resize();
            syncAnimation();
        });
     </script>
